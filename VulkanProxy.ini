[compat]
; auto     = Выберает совместимость с нативным/гибридным/программным обеспечением из реальных функций драйвера.
; native   = строгий режим «только нативные средства»; отсутствующие расширения среды выполнения (RT) не имитируются
; hybrid   = использует реальные компоненты RT, а виртуализируйте только недостающие
; software = принудительно использовать путь совместимости без трассировки лучей (RT) (это НЕ программный трассировщик лучей)
Mode=auto
; 1 = вообще не сообщать игре о наличии аппаратного RT (одинаковый набор шейдеров
; на любой видеокарте; удобно, чтобы одна и та же папка spv_replace работала везде).
; 0 = авто (на RTX/RDNA3 игра может собрать другой набор шейдеров - тогда включите 1).
ForceVirtualRt=0
;
; ВАЖНО (RT теперь "всё или ничего"):
;   Раньше на видеокартах, которые умеют часть RT (например GTX 1660 Ti: трассировка
;   конвейером есть, ray query нет), прокси отдавал игре СМЕСЬ: часть RT настоящая,
;   часть виртуальная. Игра собирала шейдеры трассировочных стадий (ray generation /
;   miss / closest hit) - такие шейдеры невозможно ни переписать, ни подменить, - и
;   прокси возвращал вместо них "пустышки". Дальше игра отдавала такую пустышку драйверу
;   NVIDIA, и драйвер падал: EXCEPTION 0xC0000005 в nvoglv64.dll, чтение по адресу
;   0xFFFFFFFFFFFFFFFF. Игра закрывалась сразу после того, как начинала звучать музыка.
;   Теперь так нельзя: если хотя бы одну часть RT приходится виртуализировать, то вся
;   RT на этой карте виртуальная, и игра вообще не собирает RT-шейдеры. В лог пишется
;   строка RT POLICY: она прямо говорит, что выбрано и почему.

[spirv]
; Float16: драйвер сам умеет такие шейдеры (проверено вами) -> 0
DenyFloat16=0
; пробуем пропустить Int16 (4 шейдера): драйвер, вероятно, справится так же, как с Float16.
; Если появятся падения или артефакты - верните 1.
DenyInt16=0
DenyDotProduct=1
; DenyRayTracing - единственный выключатель трассировки лучей, и он теперь ДЕЙСТВУЕТ
; (раньше читался в лог и ни на что не влиял).
;   1 = решает железо: модуль, который драйвер не умеет, блокируется; который умеет -
;       проходит как есть. Именно это делает набор шейдеров одинаковым на всех картах.
;   0 = "хочу настоящий RT на этой карте": RT-модули не блокируются и не переписываются.
;       Только для карт, которые правда умеют RT, иначе драйвер получит неподдерживаемый SPIR-V.
DenyRayTracing=1
DenyMesh=1
; 1 = шейдеры с RayQuery (лучи) переписываются: запросы лучей удаляются, "ничего не попало".
;     Это возвращает освещение/материалы, которые раньше отключались целиком.
RewriteRayQuery=1
; сохранить первые N переписанных шейдеров (до/после) в spv_rq_in_N.spv / spv_rq_out_N.spv (для проверки)
DumpRewrite=0
; сохранить первые N шейдеров, которые переписать НЕ удалось (spv_rqfail_N.spv)
DumpRewriteFail=0
; сохранить N рабочих compute-шейдеров двух видов (с кубмапами / с Int64) для сравнения с падающими:
; spv_ok_cubearray_*.spv и spv_ok_int64_*.spv
DumpSamples=0
; 1 = сохранить рядом с логом первые N модулей, которые игра отдала прокси (spv_input_*.spv).
; Нужен только для диагностики: по такому файлу spv_check.exe скажет, почему замена не подошла.
; ВКЛЮЧИ на один запуск, если нужно разобраться: DumpLookupInput=32
;   DumpLookupInput=-1  = сохранить ВООБЩЕ ВСЕ модули (полная инвентаризация набора
;   шейдеров игры; это то, что нужно, если собирать папку замен целиком). Файлов будет
;   около тысячи, общий размер - сотни мегабайт, поэтому только на один запуск.
;   Файлы называются spv_input_<стадия>_<номер модуля>_<хэш>.spv - хэш прямо в имени,
;   поэтому файл замены надо называть spv_<хэш>.spv (без ручного поиска в логе).
;   Сначала сохраняются шейдеры, которые РАБОТАЮТ С ЛУЧАМИ (там и теряется свет),
;   потом те, для которых в папке нет замены.
;   Дальше: python tools\spv_light_report.py "<папка игры>" - покажет, какие модули
;   виноваты в темноте и как назвать файл замены.
DumpLookupInput=0
; 1 = брать готовые замены шейдеров из папки spv_replace (рядом с dll): spv_<хэш оригинала>.spv
;   ВАЖНО: отбор шейдеров по возможностям видеокарты.
; FollowHardwareCaps=1 - блокировка по Deny* применяется только если драйвер ДЕЙСТВИТЕЛЬНО
;     не умеет нужную возможность (float16/int16/dot/mesh). Итог: набор заблокированных
;     шейдеров везде одинаковый (эта возможность недоступна), поэтому одна и та же папка
;     spv_replace работает и на R7 260X, и на GTX 1060/1080, и на Intel. Именно из-за
;     старого поведения (жёстко "как на GCN2") на NVIDIA замены не срабатывали,
;     а освещение в комнатах оставалось чёрным.
;     Блокируется всегда не больше, чем раньше: на рабочей R7 260X ничего не изменится.
; 0 = старое поведение: блокировать строго по флагам Deny* из этого файла.
FollowHardwareCaps=1
; 1 = если хэш файла spv_<хэш>.spv не совпал (игра собрала эквивалентный шейдер с другими
;     id/форматами на другой видеокарте), подобрать замену по описанию шейдера.
;     0 = только точное совпадение хэша (как в старых версиях).
StructureMatchFallback=1
; 1 = универсальный подбор замены. Если точного совпадения нет, замена ищется по:
;     - стадии шейдера (вершинный / фрагментный / вычислительный) - всегда,
;     - набору инструкций (без учёта порядка и без RT-кода) - похожесть,
;     - раскладке дескрипторов (set/binding/location),
;     - именам функций и буферов из исходника (на любой видеокарте одинаковы).
;     Уровни: identical -> similar -> loose. Если два файла spv_replace одинаково
;     похожи, замена НЕ ставится (лучше оригинал, чем чужой шейдер).
;     Именно это заставляет папку работать на GTX 1060 / 1080 Ti / Intel, где игра
;     собирает шейдеры другого размера и порядка, чем на R7 260X.
;     0 = оставить только точные совпадения.
FuzzyMatch=1
; САМОПРОВЕРКА УНИВЕРСАЛЬНОГО ПОДБОРА. Работает на любой видеокарте, вторая карта не нужна:
; каждый файл из spv_replace один раз "пересобирается" так, как его собрал бы другой
; драйвер (новые номера id, другой порядок инструкций, без отладочных имён, другой
; размер) и проверяется, что замена всё равно находится.
; В логе будут строки SELFTEST: ... OK/FAILED и итоговая SELFTEST PASSED.
; 1 = проверить первые 8 файлов (занимает доли секунды), 2 = проверить все файлы.
; 0 = выключено. Включайте её, чтобы убедиться в переносимости папки перед отправкой
; лога другому человеку.
SelfTest=0
; 1 = ПРИНУДИТЕЛЬНО привести набор возможностей, который видит игра, к профилю эталонной
;     карты (R7 260X): shaderInt16/Int64/Float64 = нет, 8-битное хранилище = нет,
;     dot product = нет. Тогда игра перестаёт собирать другие варианты шейдеров на
;     NVIDIA/Intel и одна папка spv_replace подходит всем. Включайте, если замены
;     всё равно не применяются (в логе много "no replacement for hash=").
;     0 = оставить реальные возможности драйвера (по умолчанию).
UniformShaderProfile=0
UseReplacements=1
; 1 = если драйвер падает/отклоняет шейдер, пробовать эквивалентные варианты (OpConvertUToPtr -> OpBitcast и т.д.)
TryVariants=1
; 1 = помнить SPIR-V каждого шейдера (нужно, чтобы при ошибке пайплайна сохранить его шейдеры)
; Остаётся 0: патчер удерживает в памяти только выбранные замены spv_replace.
KeepShaderCode=0
; 1 = диагностика ТОЛЬКО модулей из spv_replace: pipeline/hash/dispatch и фактически
;     привязанные descriptor resources. Не включает LogAll и не сохраняет код всех
;     шейдеров игры. Нужна, если разбираемся, почему конкретная замена не работает.
TraceReplacementShaders=1
; ---- fp16/int16 handling (defaults are what the reference card needs) ----
; 1 = поднимать fp16 до fp32 в арифметике. 0 = выключено (управляется LowerFp16AndInt16).
PromoteFloat16=0
; 1 = понижать fp16-вычисления. 0 = выключено.
LowerFp16=0
; 1 = понижать fp16 И int16 с учётом раскладки хранилищ (основной путь для GCN2).
;     0 = не трогать такие шейдеры (тогда они уйдут драйверу как есть).
LowerFp16AndInt16=1
; 1 = убрать из шейдера объявление возможности Float16 после понижения.
;     Включайте только если драйвер жалуется на Float16 после успешного понижения.
DropF16Cap=0
; Яркость пост-обработки: 1.0 = выключено (без изменений). Рабочий диапазон 1.0..8.0.
BrightnessGain=1.0
; Хэши активных compute-шейдеров через запятую - диагностика конкретных модулей
; (пусто = выключено). Пример: 4E83EFA89EF950D3,801F80BF7BDFA946
; Полезно, чтобы SPVTRACE писал только про нужные замены.
DumpActiveComputeHashes=
; 1 = понижать версию SPIR-V 1.6 -> 1.5 (драйвер знает максимум 1.5)
PatchVersion=1
; 1 = писать в лог каждый шейдер
LogAll=0
; 1 = ВЫКЛЮЧИТЬ фильтр шума (полный подробный лог)
Verbose=0
; B4: сердцебиение привязок ресурсов раз в N тысяч. 0 = молчать (по умолчанию).
;     В лог и так попадают только ПЕРВЫЕ 4 привязки, ОШИБКИ и МЕДЛЕННЫЕ (>100 мс).
;     Раньше писалось 2 строки на каждую 64-ю привязку - это было ~90% лога.
VerboseResourceK=0
; 1 = компиляция шейдеров/пайплайнов в драйвере идёт по одному потоку
SerializeCompile=1
; 1 = если драйвер падает при создании шейдера/пайплайна, подставить заглушку и продолжить
CatchDriverCrash=1
; Возможности SPIR-V (номера через запятую), шейдеры с ними не отдаются драйверу.
DenyComputeCaps=
DenyAnyCaps=
; compute-шейдеры, у которых ЕСТЬ ВСЕ перечисленные возможности сразу (11=Int64, 45=SampledCubeArray).
; ПУСТО: теперь такие шейдеры идут в драйвер, а при падении пробуются обходные варианты (TryVariants)
DenyComputeAllCaps=
; 1 = старый отладочный выход после первого present
ExitAfterFirstPresent=0
