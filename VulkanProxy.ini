[compat]
; auto     = Выберает совместимость с нативным/гибридным/программным обеспечением из реальных функций драйвера.
; native   = строгий режим «только нативные средства»; отсутствующие расширения среды выполнения (RT) не имитируются
; hybrid   = использует реальные компоненты RT, а виртуализируйте только недостающие
; software = принудительно использовать путь совместимости без трассировки лучей (RT) (это НЕ программный трассировщик лучей)
Mode=auto

[spirv]
; Float16: драйвер сам умеет такие шейдеры (проверено вами) -> 0
DenyFloat16=0
; пробуем пропустить Int16 (4 шейдера): драйвер, вероятно, справится так же, как с Float16.
; Если появятся падения или артефакты - верните 1.
DenyInt16=0
DenyDotProduct=1
DenyRayTracing=1
DenyMesh=1
; 1 = шейдеры с RayQuery (лучи) переписываются: запросы лучей удаляются, "ничего не попало".
;     Это возвращает освещение/материалы, которые раньше отключались целиком.
RewriteRayQuery=1
; сохранить первые N переписанных шейдеров (до/после) в spv_rq_in_N.spv / spv_rq_out_N.spv (для проверки)
DumpRewrite=0
; сохранить первые N шейдеров, которые переписать НЕ удалось (spv_rqfail_N.spv)
DumpRewriteFail=0
; сохранить N рабочих compute-шейдеров двух видов (с кубмапами / с Int64) для сравнения с падающими:
; spv_ok_cubearray_*.spv и spv_ok_int64_*.spv
DumpSamples=0
; 1 = брать готовые замены шейдеров из папки spv_replace (рядом с dll): spv_<хэш оригинала>.spv
UseReplacements=1
; 1 = если драйвер падает/отклоняет шейдер, пробовать эквивалентные варианты (OpConvertUToPtr -> OpBitcast и т.д.)
TryVariants=1
; 1 = помнить SPIR-V каждого шейдера (нужно, чтобы при ошибке пайплайна сохранить его шейдеры)
; Остаётся 0: патчер удерживает в памяти только выбранные замены spv_replace.
KeepShaderCode=0
; РЎРѕР±РёСЂР°С‚СЊ С‚РѕР»СЊРєРѕ SPVTRACE РґР»СЏ РјРѕРґСѓР»РµР№ РёР· spv_replace: pipeline/hash/dispatch/descriptor resources.
; РќРµ РІРєР»СЋС‡Р°РµС‚ LogAll Рё РЅРµ СЃРѕС…СЂР°РЅСЏРµС‚ РєРѕРґ РІСЃРµС… РёРіСЂРѕРІС‹С… С€РµР№РґРµСЂРѕРІ.
TraceReplacementShaders=1
; Диагностика только модулей из spv_replace: pipeline/hash/dispatch и фактически привязанные descriptor resources.
TraceReplacementShaders=1
; 1 = понижать версию SPIR-V 1.6 -> 1.5 (драйвер знает максимум 1.5)
PatchVersion=1
; 1 = писать в лог каждый шейдер
LogAll=0
; 1 = ВЫКЛЮЧИТЬ фильтр шума (полный подробный лог)
Verbose=0
; 1 = компиляция шейдеров/пайплайнов в драйвере идёт по одному потоку
SerializeCompile=1
; 1 = если драйвер падает при создании шейдера/пайплайна, подставить заглушку и продолжить
CatchDriverCrash=1
; Возможности SPIR-V (номера через запятую), шейдеры с ними не отдаются драйверу.
DenyComputeCaps=
DenyAnyCaps=
; compute-шейдеры, у которых ЕСТЬ ВСЕ перечисленные возможности сразу (11=Int64, 45=SampledCubeArray).
; ПУСТО: теперь такие шейдеры идут в драйвер, а при падении пробуются обходные варианты (TryVariants)
DenyComputeAllCaps=
; 1 = старый отладочный выход после первого present
ExitAfterFirstPresent=0
